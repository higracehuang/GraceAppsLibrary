name: Sync App Store Metadata & Screenshots (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: 'App version to target (leave blank to auto-detect MARKETING_VERSION)'
        required: false
        default: ''
        type: string
      skip_screenshots:
        description: 'Skip uploading screenshots'
        required: false
        default: false
        type: boolean
      skip_metadata:
        description: 'Skip uploading metadata'
        required: false
        default: false
        type: boolean
      platform:
        description: 'Fastlane platform (ios or mac)'
        required: false
        default: 'ios'
        type: string
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY:
        required: true

jobs:
  sync-appstore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Export AppInfo and Screenshots to Fastlane
        run: |
          SCRIPT_PATH=""
          if [ -f "scripts/export_to_fastlane.py" ]; then
            SCRIPT_PATH="scripts/export_to_fastlane.py"
          elif [ -f "Scripts/export_to_fastlane.py" ]; then
            SCRIPT_PATH="Scripts/export_to_fastlane.py"
          fi

          if [ -n "$SCRIPT_PATH" ]; then
            ARGS=""
            if [ -n "${{ inputs.version }}" ]; then
              ARGS="$ARGS --version ${{ inputs.version }}"
            fi
            if [ "${{ inputs.skip_screenshots }}" = "true" ]; then
              ARGS="$ARGS --metadata-only"
            fi
            if [ "${{ inputs.skip_metadata }}" = "true" ]; then
              ARGS="$ARGS --screenshots-only"
            fi
            python3 "$SCRIPT_PATH" $ARGS
          else
            echo "No export_to_fastlane.py found, skipping export step."
          fi

      - name: Upload Metadata & Screenshots via Fastlane Deliver
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS: 'true'
        run: |
          bundle exec fastlane ${{ inputs.platform }} upload_marketing \
            skip_screenshots:${{ inputs.skip_screenshots }} \
            skip_metadata:${{ inputs.skip_metadata }} \
            version:"${{ inputs.version }}" || \
          fastlane ${{ inputs.platform }} upload_marketing \
            skip_screenshots:${{ inputs.skip_screenshots }} \
            skip_metadata:${{ inputs.skip_metadata }} \
            version:"${{ inputs.version }}"
